<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Ymmo — Liste des biens immobiliers à Toulouse" />
  <title>Biens immobiliers — Ymmo</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  { DEFAULT: '#0F1C2E', mid: '#1A2D45' },
            clay:  { DEFAULT: '#D45A1A', light: '#E8743A' },
            slate: { DEFAULT: '#F4F5F7', mid: '#DDE2E9' },
            muted: '#8FA3B8',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans:  ['DM Sans', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />

  <style>
    .property-card { transition: transform 0.25s ease, box-shadow 0.25s ease; }
    .property-card:hover { transform: translateY(-5px); box-shadow: 0 20px 40px rgba(15,28,46,0.11); }
    .property-card:hover .card-img { transform: scale(1.04); }
    .filter-input:focus { outline: none; border-color: #D45A1A; box-shadow: 0 0 0 3px rgba(212,90,26,0.12); }
  </style>
</head>
<body class="font-sans bg-slate text-navy min-h-screen">

<header id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-navy shadow-md">
  <div class="max-w-7xl mx-auto px-6 lg:px-10 h-16 flex items-center justify-between">
    <a href="../index.html" class="font-serif font-bold text-xl text-white tracking-tight">
      Ymmo<span class="text-clay">.</span>
    </a>
    <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-white/75">
      <a href="properties.html" class="text-white border-b border-clay pb-0.5">Biens</a>
      <a href="#" class="hover:text-white transition-colors">Agences</a>
      <a href="#" class="hover:text-white transition-colors">Contact</a>
    </nav>
    <div class="hidden md:flex items-center gap-4">
      <a href="#" class="text-sm text-white/70 hover:text-white font-medium transition-colors">Connexion</a>
      <a href="#" class="text-sm bg-clay hover:bg-clay-light text-white font-semibold px-5 py-2 rounded-lg transition-colors">Publier</a>
    </div>
    <button id="menu-btn" aria-label="Menu" class="md:hidden text-white p-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
  </div>
  <div id="mobile-menu" class="hidden md:hidden bg-navy-mid border-t border-white/10 px-6 py-4 flex flex-col gap-3 text-sm text-white/80">
    <a href="properties.html" class="text-white font-semibold">Biens</a>
    <a href="#">Agences</a>
    <a href="#">Contact</a>
    <hr class="border-white/10" />
    <a href="#">Connexion</a>
    <a href="#" class="bg-clay text-white font-semibold px-4 py-2 rounded-lg text-center">Publier</a>
  </div>
</header>

<section class="bg-navy pt-28 pb-10 px-6">
  <div class="max-w-7xl mx-auto">
    <p class="text-clay text-xs font-semibold uppercase tracking-widest mb-3 flex items-center gap-2">
      <span class="w-5 h-px bg-clay inline-block"></span>
      Catalogue
    </p>
    <h1 class="font-serif font-bold text-white text-3xl sm:text-4xl mb-2">
      Biens immobiliers
    </h1>
    <p class="text-white/45 text-sm">Toulouse et sa région</p>
  </div>
</section>

<div class="max-w-7xl mx-auto px-6 lg:px-10 py-10 flex flex-col lg:flex-row gap-8">

  <aside class="w-full lg:w-72 flex-shrink-0">
    <div class="bg-white rounded-2xl border border-slate-mid p-6 sticky top-24">

      <div class="flex items-center justify-between mb-6">
        <h2 class="font-semibold text-navy text-sm">Filtres</h2>
        <button id="btn-reset"
          class="text-xs text-muted hover:text-clay font-medium transition-colors">
          Réinitialiser
        </button>
      </div>

      <div class="flex flex-col gap-5">

        <div>
          <label class="block text-xs font-semibold text-navy/60 uppercase tracking-wider mb-2">Ville</label>
          <input id="filter-city" type="text" placeholder="Toulouse, Colomiers…"
            class="filter-input w-full bg-slate rounded-xl px-4 py-2.5 text-sm text-navy border border-slate-mid transition-all" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-navy/60 uppercase tracking-wider mb-2">Type de bien</label>
          <select id="filter-type"
            class="filter-input w-full bg-slate rounded-xl px-4 py-2.5 text-sm text-navy border border-slate-mid transition-all cursor-pointer">
            <option value="">Tous les types</option>
          </select>
        </div>

        <div>
          <label class="block text-xs font-semibold text-navy/60 uppercase tracking-wider mb-2">Prix</label>
          <div class="flex gap-2">
            <input id="filter-min-price" type="number" placeholder="Min €"
              class="filter-input w-full bg-slate rounded-xl px-3 py-2.5 text-sm text-navy border border-slate-mid transition-all" />
            <input id="filter-max-price" type="number" placeholder="Max €"
              class="filter-input w-full bg-slate rounded-xl px-3 py-2.5 text-sm text-navy border border-slate-mid transition-all" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-navy/60 uppercase tracking-wider mb-2">Surface min (m²)</label>
          <input id="filter-min-surface" type="number" placeholder="Ex : 40"
            class="filter-input w-full bg-slate rounded-xl px-4 py-2.5 text-sm text-navy border border-slate-mid transition-all" />
        </div>

        <div>
          <label class="block text-xs font-semibold text-navy/60 uppercase tracking-wider mb-2">Agence</label>
          <select id="filter-agency"
            class="filter-input w-full bg-slate rounded-xl px-4 py-2.5 text-sm text-navy border border-slate-mid transition-all cursor-pointer">
            <option value="">Toutes les agences</option>
          </select>
        </div>

        <button id="btn-search"
          class="w-full bg-clay hover:bg-clay-light text-white font-semibold text-sm py-3 rounded-xl transition-colors flex items-center justify-center gap-2 mt-1">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
          Rechercher
        </button>

      </div>
    </div>
  </aside>

  <div class="flex-1 min-w-0">

    <div class="flex items-center justify-between mb-6">
      <p id="results-count" class="text-sm font-medium text-muted">Chargement…</p>
    </div>

    <div id="loader" class="hidden flex justify-center py-20">
      <div class="w-8 h-8 border-2 border-slate-mid border-t-clay rounded-full animate-spin"></div>
    </div>

    <div id="properties-grid" class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-3 gap-6 transition-opacity duration-200">
    </div>

    <div id="empty-state" class="hidden text-center py-24">
      <div class="w-14 h-14 bg-slate-mid rounded-2xl flex items-center justify-center mx-auto mb-4">
        <svg class="w-6 h-6 text-muted" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
            d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
      </div>
      <p class="font-semibold text-navy text-base mb-1">Aucun bien trouvé</p>
      <p class="text-muted text-sm">Essayez de modifier ou réinitialiser vos filtres.</p>
    </div>

    <div id="pagination" class="flex items-center justify-center gap-2 mt-10"></div>

  </div>
</div>

<footer class="bg-navy mt-16 py-8 px-6">
  <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-3 text-xs text-white/25">
    <a href="../index.html" class="font-serif font-bold text-base text-white">
      Ymmo<span class="text-clay">.</span>
    </a>
    <p>© 2026 Ymmo. Tous droits réservés.</p>
    <div class="flex gap-5">
      <a href="#" class="hover:text-white/50 transition-colors">Mentions légales</a>
      <a href="#" class="hover:text-white/50 transition-colors">CGU</a>
    </div>
  </div>
</footer>

<script src="../js/auth.js"></script>
<script src="../js/properties.js"></script>


</body>
</html>
