<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mon espace — Ymmo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy:  { DEFAULT: '#0F1C2E', mid: '#1A2D45' },
            clay:  { DEFAULT: '#D45A1A', light: '#E8743A' },
            slate: { DEFAULT: '#F4F5F7', mid: '#DDE2E9' },
            muted: '#8FA3B8',
          },
          fontFamily: {
            serif: ['Playfair Display', 'Georgia', 'serif'],
            sans:  ['DM Sans', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    .input-field {
      width: 100%;
      background: #F4F5F7;
      border: 1.5px solid #DDE2E9;
      border-radius: 0.75rem;
      padding: 0.625rem 1rem;
      font-size: 0.875rem;
      color: #0F1C2E;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #D45A1A;
      box-shadow: 0 0 0 3px rgba(212,90,26,0.12);
      background: #fff;
    }
    .input-field::placeholder { color: #8FA3B8; }
  </style>
</head>
<body class="font-sans bg-[#F4F5F7] text-[#0F1C2E] min-h-screen flex">

<!-- SIDEBAR -->
<aside id="sidebar"
  class="fixed top-0 left-0 h-full w-64 bg-[#0F1C2E] z-40 flex flex-col
         -translate-x-full lg:translate-x-0 transition-transform duration-300">

  <div class="px-6 py-6 border-b border-white/10">
    <a href="../index.html" class="font-serif font-bold text-xl text-white">
      Ymmo<span class="text-[#D45A1A]">.</span>
    </a>
    <p class="text-white/40 text-xs mt-1">Mon espace</p>
  </div>

  <nav class="flex-1 px-3 py-5 flex flex-col gap-1">

    <button data-section="appointments"
      class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-colors text-white/60">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
      </svg>
      Mes rendez-vous
    </button>

    <button id="nav-vente" data-section="vente"
      class="nav-link hidden w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-colors text-white/60">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M12 4v16m8-8H4"/>
      </svg>
      Mettre en vente
    </button>

    <button data-section="profile"
      class="nav-link w-full flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium transition-colors text-white/60">
      <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
      </svg>
      Mon profil
    </button>

  </nav>

  <div class="px-4 py-5 border-t border-white/10">
    <div class="flex items-center gap-3 mb-4">
      <div class="w-9 h-9 rounded-full bg-[#D45A1A]/20 flex items-center justify-center text-[#D45A1A] font-bold text-sm">
        <span id="profile-avatar">U</span>
      </div>
      <div class="min-w-0">
        <p id="user-name" class="text-white text-sm font-semibold truncate"></p>
        <p id="user-role" class="text-white/40 text-xs capitalize"></p>
      </div>
    </div>
    <button onclick="logout()"
      class="w-full flex items-center gap-2 text-white/50 hover:text-white text-xs font-medium transition-colors px-2 py-1.5">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
      </svg>
      Déconnexion
    </button>
  </div>
</aside>

<div id="sidebar-overlay" class="hidden fixed inset-0 bg-[#0F1C2E]/50 z-30 lg:hidden"></div>

<!-- MAIN -->
<div class="flex-1 lg:ml-64 flex flex-col min-h-screen">

  <!-- TOPBAR -->
  <header class="bg-white border-b border-[#DDE2E9] px-6 py-4 flex items-center gap-4 sticky top-0 z-20">
    <button id="menu-btn" class="lg:hidden text-[#8FA3B8] hover:text-[#0F1C2E] transition-colors">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
    </button>
    <h1 id="page-title" class="font-serif font-bold text-[#0F1C2E] text-xl"></h1>
  </header>

  <main class="flex-1 px-6 py-8 max-w-5xl w-full mx-auto">

    <!-- STATS -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 mb-8">

      <div class="bg-white rounded-2xl border border-[#DDE2E9] p-5 flex items-center gap-4">
        <div class="w-11 h-11 bg-[#0F1C2E] rounded-xl flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
          </svg>
        </div>
        <div>
          <p class="text-2xl font-bold text-[#0F1C2E] font-serif" id="stat-appointments">—</p>
          <p class="text-[#8FA3B8] text-xs font-medium">Rendez-vous</p>
        </div>
      </div>

      <div id="stat-vente-block" class="hidden bg-white rounded-2xl border border-[#DDE2E9] p-5 flex items-center gap-4">
        <div class="w-11 h-11 bg-[#D45A1A] rounded-xl flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
          </svg>
        </div>
        <div>
          <p class="text-2xl font-bold text-[#0F1C2E] font-serif">Vendeur</p>
          <p class="text-[#8FA3B8] text-xs font-medium">Soumettre un bien à un agent</p>
        </div>
      </div>

    </div>

    <!-- SECTION RDV -->
    <div id="section-appointments" class="section hidden">
      <div id="appointments-list" class="flex flex-col gap-4"></div>
    </div>

    <!-- SECTION MISE EN VENTE (vendeur uniquement) -->
    <div id="section-vente" class="section hidden">

      <div id="vente-success" class="hidden bg-green-50 border border-green-200 text-green-700 text-sm rounded-xl px-4 py-3 mb-6 flex items-center gap-2">
        <svg class="w-4 h-4 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        Votre bien a été soumis avec succès. Un agent vous contactera prochainement.
      </div>

      <div id="vente-error" class="hidden bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3 mb-6 flex items-start gap-2">
        <svg class="w-4 h-4 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span id="vente-error-msg"></span>
      </div>

      <div class="bg-white rounded-2xl border border-[#DDE2E9] p-7">
        <h2 class="font-serif font-bold text-[#0F1C2E] text-xl mb-1">Soumettre un bien</h2>
        <p class="text-[#8FA3B8] text-sm mb-6">Remplissez le formulaire, un agent prendra en charge votre dossier.</p>

        <form id="vente-form" class="flex flex-col gap-5">

          <div>
            <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Titre *</label>
            <input id="vente-title" type="text" required placeholder="Ex : Appartement T3 — Capitole" class="input-field" />
          </div>

          <div>
            <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Description</label>
            <textarea id="vente-description" rows="3" placeholder="Décrivez votre bien…" class="input-field resize-none"></textarea>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Prix souhaité (€) *</label>
              <input id="vente-price" type="number" required placeholder="250000" class="input-field" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Surface (m²)</label>
              <input id="vente-surface" type="number" placeholder="75" class="input-field" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Ville *</label>
              <input id="vente-city" type="text" required placeholder="Toulouse" class="input-field" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Code postal</label>
              <input id="vente-postal-code" type="text" placeholder="31000" class="input-field" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Adresse *</label>
              <input id="vente-address" type="text" required placeholder="12 rue de la Paix" class="input-field" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Quartier</label>
              <input id="vente-district" type="text" placeholder="Capitole" class="input-field" />
            </div>
          </div>

          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Type de bien *</label>
              <select id="vente-type" required class="input-field cursor-pointer"></select>
            </div>
            <div>
              <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Agence *</label>
              <select id="vente-agency" required class="input-field cursor-pointer"></select>
            </div>
          </div>

          <div class="flex justify-end pt-2 border-t border-[#DDE2E9]">
            <button id="btn-vente" type="submit"
              class="bg-[#D45A1A] hover:bg-[#E8743A] text-white font-semibold text-sm px-8 py-3 rounded-xl transition-colors">
              Envoyer la demande
            </button>
          </div>

        </form>
      </div>
    </div>

    <!-- SECTION PROFIL -->
    <div id="section-profile" class="section hidden">
      <div class="bg-white rounded-2xl border border-[#DDE2E9] p-7">
        <div class="flex items-center gap-5 mb-8 pb-6 border-b border-[#DDE2E9]">
          <div class="w-16 h-16 rounded-2xl bg-[#D45A1A]/10 flex items-center justify-center text-[#D45A1A] font-bold text-2xl font-serif">
            <span id="profile-avatar-lg"></span>
          </div>
          <div>
            <p class="font-serif font-bold text-[#0F1C2E] text-2xl" id="profile-username"></p>
            <p class="text-[#8FA3B8] text-sm capitalize" id="profile-role"></p>
          </div>
        </div>
        <div class="flex flex-col gap-5">
          <div>
            <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Email</label>
            <p id="profile-email" class="text-[#0F1C2E] text-sm font-medium bg-[#F4F5F7] px-4 py-3 rounded-xl"></p>
          </div>
          <div>
            <label class="block text-xs font-semibold text-[#0F1C2E]/60 uppercase tracking-wider mb-1.5">Rôle</label>
            <p id="profile-role-field" class="text-[#0F1C2E] text-sm font-medium bg-[#F4F5F7] px-4 py-3 rounded-xl capitalize"></p>
          </div>
        </div>
      </div>
    </div>

  </main>
</div>

<script src="../js/auth.js"></script>
<script src="../js/user-dashboard.js"></script>
</body>
</html>
